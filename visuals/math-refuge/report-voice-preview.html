<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶东报告 · 原黑板语音检查</title><link rel="stylesheet" href="board-console.css"><script type="importmap">{"imports":{"three":"../3d/vendor/three.module.js"}}</script><style>body{margin:0;background:#0f1915;color:#dfe6d7;font:14px/1.6 'Microsoft YaHei',sans-serif}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;top:20px;left:25px;z-index:2;background:#14291ed9;padding:16px 22px;border-radius:6px;max-width:430px}button,select{border:1px solid #64725b;background:#23392b;color:#dce2cd;border-radius:4px;padding:8px 12px;cursor:pointer;margin:8px 6px 0 0}small{display:block;color:#a3b39f}#status{margin-top:10px;color:#c3caae}</style><nav><b>叶东报告 · 原有六块升降黑板</b><small>沈腾参考音色，AI 合成。先选择报告，再点击聆听。</small><button id="select">选择叶东报告</button><button id="play" disabled>聆听 / 暂停</button><button id="language">中 / EN</button><button id="focus">聚焦当前黑板</button><button id="complete">显示完整板书</button><button id="other">切换胡勇报告</button><select id="page" aria-label="板书页"></select><div id="status">准备黑板 · 尚未请求语音</div></nav><script type="module">
import {REPORTS} from './report-catalog.js?v=report-seminar-5';import * as T from 'three';import {createLecture} from './lecture.js?v=report-seminar-5';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#13261d');scene.add(new T.HemisphereLight('#f4f2e5','#17291d',2));
const keyLight=new T.DirectionalLight('#fff7ea',2.2);keyLight.position.set(26,7,2);keyLight.target.position.set(28,3,-10);scene.add(keyLight,keyLight.target);
const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(28,3.2,2);camera.lookAt(28,2.8,-10.45);
const lecture=await createLecture(scene,renderer,{requireSelection:true,defaultReport:'ye',writingStyle:'refined',reports:new URLSearchParams(location.search).has('boards')?REPORTS.map(r=>({...r,narration:undefined})):REPORTS});await lecture.setLanguage('zh');
const page=document.getElementById('page');function choices(){page.replaceChildren(...lecture.pages.map((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+' · '+p.title;return o;}));}choices();
document.getElementById('status').textContent='未选择报告 · 零语音请求';
document.getElementById('select').onclick=async()=>{await lecture.setReport('ye');choices();document.getElementById('play').disabled=false;};
document.getElementById('other').onclick=async()=>{await lecture.setReport('hu');choices();};
document.getElementById('play').onclick=()=>lecture.toggleVoice();
document.getElementById('language').onclick=()=>lecture.setLanguage(lecture.language==='zh'?'en':'zh');
document.getElementById('focus').onclick=()=>{const f=lecture.focus(true);camera.position.set(f.x,f.y+.08,f.z+7);camera.lookAt(f);};page.onchange=()=>lecture.select(Number(page.value));document.getElementById('complete').onclick=async()=>{await lecture.completePage(Number(page.value));lecture.playing=false;};
let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.1,(now-last)/1000);last=now;lecture.update(dt);renderer.render(scene,camera);const v=lecture.voiceState;const status=document.getElementById('status');status.dataset.phase=v.phase;status.dataset.page=lecture.clock.page;status.dataset.progress=lecture.clock.slots[lecture.clock.active].progress;status.dataset.time=v.time;status.dataset.duration=v.duration;status.textContent=v.phase==='idle'?'未选择有语音的报告 · 零语音请求':v.phase==='loading'?'语音加载 · '+(v.progress===null?'…':Math.round(v.progress*100)+'%'):v.phase==='playing'?('报告 '+v.time.toFixed(1)+' / '+v.duration.toFixed(1)+' 秒 · '+lecture.status()):v.phase==='paused'?'报告已暂停 · '+lecture.status():v.phase==='error'?v.error:v.phase==='ended'?'报告结束':'语音已就绪 · 点击黑板右下角聆听';page.value=lecture.clock.page;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const ray=new T.Raycaster();renderer.domElement.addEventListener('click',e=>{ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hit=ray.intersectObjects(lecture.hoverTargets,false).find(h=>h.object.userData.action==='voice:toggle');if(hit)void lecture.toggleVoice();});
</script></html>
