<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三维流体 · 海滩水槽</title>
<style>*{box-sizing:border-box}body{margin:0;color:#edf4f3;background:#18323f;font:14px/1.6 system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;left:24px;top:18px;right:24px;pointer-events:none}h1{font-size:20px;font-weight:500;margin:0}p{font-size:12px;opacity:.8;margin:4px 0}.panel{position:absolute;bottom:18px;left:18px;right:18px;padding:14px;background:#0c2435d9;border:1px solid #ffffff30;border-radius:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{font:inherit;background:#ffffff14;color:inherit;border:1px solid #ffffff40;padding:7px 12px;border-radius:5px;cursor:pointer}option{color:#222}label{display:flex;gap:6px;align-items:center}#timeline{width:200px}#status{font-size:12px;opacity:.8}#error{color:#ffcaac}@media(max-width:600px){header{left:14px}.panel{left:10px;right:10px;gap:8px;padding:10px}#timeline{width:135px}}</style>
<canvas id="view" aria-label="真实液体模拟缓存的三维回放"></canvas>
<header><h1>三维流体 · 海滩水槽</h1><p>Blender Mantaflow · 小尺度验证 / 拖动旋转，滚轮缩放</p><p id="error"></p></header>
<div class="panel"><button id="play">暂停</button><label>时间 <input id="timeline" type="range" min="0" max="5.92" step="0.083333" value="0"><output id="time">0.00 s</output></label><label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><label><input id="foam" type="checkbox" checked>模拟泡沫</label><label><input id="wire" type="checkbox">网格</label><button id="reset">重置视点</button><span id="status">正在读取模拟缓存…</span></div>
<script type="module" src="./fluid-player.js"></script></html>
