<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <base href="../math-refuge/">
 <meta name="description" content="板书：独立报告厅、灰色智慧屏和同步语音板书。镜头在报告厅内自由移动。">
 <meta name="theme-color" content="#666b6d">
 <title>板书 · Visual Lab</title>
 <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="board-console.css">
 <link rel="stylesheet" href="course-library.css">
 
 <link rel="stylesheet" href="blackboard.css?v=cc07a54b0cb1">
 <script type="importmap">{"imports":{"three":"../3d/vendor/three.module.js"}}</script>
</head>
<body>
 <canvas id="world" tabindex="0" aria-label="报告厅板书，拖动转向，滚轮前后移动，WASD和QE控制镜头，Z上升、X下降，空格暂停或恢复板书"></canvas>
 <header class="blackboard-header">
  <a class="back" href="../" aria-label="返回Visual主页">← <span>VISUAL LAB</span></a>
  <div class="identity"><h1>板书</h1><p id="topic">报告厅</p></div>
  <nav aria-label="报告厅工具"><button id="catalog" disabled>课堂</button><button id="fullscreen" aria-pressed="false" class="icon-button" aria-label="全屏浏览" title="全屏浏览" data-tip="全屏浏览"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button id="hideUI" class="icon-button" aria-label="隐藏界面，按 H 恢复" title="隐藏界面，按 H 恢复" data-tip="隐藏界面，按 H 恢复"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Zm1-9 18 18"/><circle cx="12" cy="12" r="3"/></svg></button><button id="settingsButton" aria-expanded="false" aria-controls="settings" class="icon-button" aria-label="设置" title="设置" data-tip="设置"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-.7 2.3-2.2 1L4 5.7l-2 3.5 1.7 1.6v2.5L2 14.8l2 3.5 2.1-.6 2.2 1L9 21h4l.7-2.3 2.2-1 2.1.6 2-3.5-1.7-1.5v-2.5L20 9.2l-2-3.5-2.1.6-2.2-1L13 3Z"/><circle cx="11" cy="12" r="3"/></svg></button></nav>
 </header>
 <section id="loading" class="loading" role="status"><div><p>板书 / 报告厅</p><h2 id="loadingText">正在准备报告厅…</h2><button id="retry" hidden>重新加载</button></div></section>
 <section id="settings" class="blackboard-settings" aria-labelledby="settingsHeading" hidden>
  <header><h2 id="settingsHeading">设置</h2><button id="settingsClose" aria-label="关闭设置">×</button></header>
  <fieldset><legend>镜头</legend><label class="check"><input id="autoFollow" type="checkbox" checked>自动跟随当前黑板</label><small id="autoState">手动调整后5秒自动回位</small><div class="setting-actions"><button id="overview">报告厅全景</button><button id="focus" disabled>当前黑板</button></div></fieldset>
  <fieldset><legend>播放</legend><label>语音速度<select id="rate" aria-label="语音速度" disabled><option value=".85">0.85×</option><option value="1" selected>1.00×</option><option value="1.15">1.15×</option><option value="1.3">1.30×</option></select></label><label>板书语言<button id="language" aria-label="切换板书语言" disabled>EN</button></label></fieldset>
  <fieldset><legend>板书</legend><label for="erasingSpeed"><span>擦板速度 <output id="erasingSpeedValue">2×</output></span><input id="erasingSpeed" type="range" min="0.5" max="4" step="0.25" value="2" aria-label="擦板速度"></label><small>默认2倍，独立于语音；与难民营共用本机设置。</small></fieldset>
  <fieldset><legend>性能</legend><label>画质<select id="quality" aria-label="画质"><option value="auto">自动 · 推荐</option><option value="clear">清晰</option><option value="saver">节能</option></select></label><label>最高帧率<select id="frameRate" aria-label="最高帧率"><option value="60">60 帧</option><option value="30">30 帧</option></select></label></fieldset>
 </section>
 <button id="showUI" hidden class="icon-button" aria-label="显示界面" title="显示界面" data-tip="显示界面"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
 <footer class="blackboard-controls" aria-label="板书播放控制">
  <div class="transport"><button id="previous" aria-label="上一块黑板" disabled>←</button><button id="play" aria-label="播放板书" title="播放" disabled><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m8 4 12 8-12 8Z"/></svg></button><button id="next" aria-label="下一块黑板" disabled>→</button></div>
  <label class="page-label"><span class="sr-only">当前黑板</span><select id="page" aria-label="选择黑板" disabled><option>尚未选择内容</option></select></label>
  <div class="view-controls"><button id="farther" aria-label="拉远黑板视角" disabled>−</button><button id="closer" aria-label="拉近黑板视角" disabled>＋</button></div>
  <p id="status" class="sr-only" role="status">选择课堂，开始板书</p>
 </footer>
 <button id="exitFullscreen" class="icon-button" aria-label="退出全屏" title="退出全屏" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h5V3m13 5h-5V3M3 16h5v5m13-5h-5v5"/></svg></button>
 <section id="breakCountdown" aria-label="课间休息倒计时" hidden><output id="breakTime">05:00</output></section>
 <p id="notice" role="alert" hidden></p>
 <script type="module" src="blackboard-bundle.js?v=409bdd22170a"></script>
</body>
</html>
