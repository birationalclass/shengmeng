<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <base href="../math-refuge/">
 <meta name="description" content="板书：独立报告厅、灰色智慧屏和同步语音板书。镜头在报告厅内自由移动。">
 <meta name="theme-color" content="#666b6d">
 <title>板书 · Visual Lab</title>
 <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="board-console.css">
 <link rel="stylesheet" href="course-library.css">
 <link rel="stylesheet" href="screen-webview.css">
 <link rel="stylesheet" href="blackboard.css?v=03f91b151c83">
 <script type="importmap">{"imports":{"three":"../3d/vendor/three.module.js"}}</script>
</head>
<body>
 <canvas id="world" tabindex="0" aria-label="报告厅板书，拖动转向，滚轮前后移动，WASD和QE控制镜头"></canvas>
 <header class="blackboard-header">
  <a class="back" href="../" aria-label="返回Visual主页">← <span>VISUAL LAB</span></a>
  <div class="identity"><h1>板书</h1><p id="topic">报告厅</p></div>
  <nav aria-label="报告厅工具"><button id="catalog" disabled>课堂</button><button id="reports" disabled>报告</button><button id="overview">全景</button><button id="focus" disabled>当前板</button><button id="fullscreen" aria-label="全屏">⛶</button></nav>
 </header>
 <section id="loading" class="loading" role="status"><div><p>板书 / 报告厅</p><h2 id="loadingText">正在准备报告厅…</h2><button id="retry" hidden>重新加载</button></div></section>
 <footer class="blackboard-controls" aria-label="板书播放控制">
  <div class="transport"><button id="previous" aria-label="上一块黑板" disabled>←</button><button id="play" aria-label="播放板书" disabled>播放</button><button id="next" aria-label="下一块黑板" disabled>→</button></div>
  <label class="page-label"><span class="sr-only">当前黑板</span><select id="page" aria-label="选择黑板" disabled><option>尚未选择内容</option></select></label>
  <div class="view-controls"><button id="language" aria-label="切换板书语言" disabled>EN</button><button id="farther" aria-label="拉远黑板视角" disabled>−</button><button id="closer" aria-label="拉近黑板视角" disabled>＋</button><label><span class="sr-only">语速</span><select id="rate" aria-label="语音速度" disabled><option value=".85">0.85×</option><option value="1" selected>1.00×</option><option value="1.15">1.15×</option><option value="1.3">1.30×</option></select></label></div>
  <p id="status" role="status">选择课堂或报告，开始板书</p>
 </footer>
 <script type="module" src="blackboard-bundle.js?v=b99709f1a86a"></script>
</body>
</html>
