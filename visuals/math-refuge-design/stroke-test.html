<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>胡勇报告 · 单页笔顺测试</title><link rel="stylesheet" href="board-console.css?v62-chalk-ink"><style>
*{box-sizing:border-box}body{margin:0;background:#e6e1d6;color:#283c33;font:14px system-ui}main{max-width:1400px;margin:24px auto;padding:0 22px}h1{font-size:22px;font-weight:550;margin:0 0 9px}.intro{color:#647368;line-height:1.7;margin:0 0 18px}.stage{position:relative;background:#183a30;border:8px solid #94846a;box-shadow:0 7px 24px #24372c22;aspect-ratio:1536/640;overflow:hidden}canvas{display:block;width:100%;height:100%}.chalk{position:absolute;left:0;top:0;width:38px;height:14px;background:linear-gradient(0deg,#d0c7b1,#fff9e9 52%,#e8deca);border-radius:4px 6px 5px 3px;box-shadow:3px 4px 5px #0005;transform-origin:2px 7px;pointer-events:none;opacity:0}.toolbar{display:flex;align-items:center;gap:15px;padding:15px 0;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:transparent;border:1px solid #9aa498;border-radius:4px;padding:6px 12px}input{accent-color:#466b59}#progress{flex:1;min-width:120px}#status{min-width:170px;font-size:12px;color:#526456}.metrics{font-size:12px;color:#65736a;line-height:1.8}a{color:inherit}.label{font-size:12px;color:#6e786f}@media(max-width:600px){main{padding:0 8px}.stage{border-width:4px}.toolbar{gap:8px}h1{font-size:18px}}
</style><main><h1>胡勇报告 · 单页笔顺测试</h1><p class="intro">保留原试样的人工笔顺，调整字母比例、回钩与转折，收紧字距。可切换原版对照；公式默认 90%，可调大小。</p><label class="label">字体 <select id="fontChoice" aria-label="手写字体"><option value="refined" selected>改进笔顺试样 · 舒展微花体</option><option value="original">原笔顺试样 · 对照</option></select></label><div class="stage" style="margin-top:14px"><canvas id="board" width="1536" height="640" aria-label="胡勇报告：243 门槛的公式推导，逐笔显现"></canvas><div class="chalk" id="chalk"></div></div><div class="toolbar"><button id="play">暂停</button><select id="mode" aria-label="书写方式"><option value="stroke">按笔顺书写</option><option value="scan">原来的横向扫描</option></select><input id="progress" type="range" min="0" max="1000" value="0" aria-label="书写进度"><select id="speed" aria-label="书写速度"><option value="1">1×</option><option value="2">2×</option><option value="0.5">0.5×</option></select><output id="status">准备轨迹…</output></div><label class="label">公式尺寸 <input id="formulaSize" type="range" min="70" max="110" step="1" value="90" aria-label="公式尺寸"><output id="formulaSizeValue">90%</output></label><div class="metrics" id="metrics"></div><p class="metrics">性能读数仅计本页 2D 书写，不包含园区 3D 渲染和 GPU 纹理上传。拖动进度可回看任意笔画，写完停留。<a href="https://arxiv.org/html/2606.31170v1">Du–Hu · Proposition 3.2, Case 1</a></p><details><summary class="label">内容与测试范围</summary><p class="metrics">沿用胡勇报告中正则曲面纤维、s ≥ 9 的证明分支，P = p_g(X) > 243。页面展示该分支的严格次数界。轨迹已按落笔、曲线、抬笔分开；尚不声称自动恢复任意字体或中文的真实笔顺。</p><p class="metrics" id="validation"></p></details></main><script type="module" src="stroke-test.js?v6-authored"></script></html>
