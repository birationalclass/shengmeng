    <div><div class="eyebrow">CINEMATIC BLACK HOLE / PHYSICAL LENS LAB</div><h1>引力深渊 · 物理透镜实验室</h1><p>第三十五版：0.30× 广角缩放、全层尺度审计与同步光学辉光</p></div>

    <aside class="lab" id="evolutionLab">
      <div class="lab-head"><span>EVOLUTION LAB</span><strong>黑洞衍变实验室</strong></div>
      <section><div class="section-title">CAMERA / 旋转观察</div>

    <div class="legend"><span><b>01</b> 测地光路</span><span><b>02</b> 三维密度</span><span><b>03</b> 差速云海</span><span><b>04</b> 体积透射</span></div>
    <div class="controls"><button id="pause">暂停动画</button><button id="contrast">增强曝光</button></div>
  </main>
  <script>
    /*
      Physics basis: Eric Bruneton, "Real-time High-Quality Rendering of
      Non-Rotating Black Holes" (2020), arXiv:2010.08735.
      This is an independent fixed-camera specialization. It numerically solves
      u'' = 1.5 u^2 - u on startup and uploads u(beta, phi) as a WebGL2 LUT.
    */
    const query=new URLSearchParams(location.search),captureMode=query.get('capture')==='1',batchMode=captureMode&&query.get('batch')==='1';
    if(captureMode)document.body.classList.add('capture');
    const canvas=document.querySelector('#scene');
    const fallback=document.querySelector('#fallback');
  const gl=canvas.getContext('webgl2',{alpha:captureMode,antialias:false,depth:false,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:captureMode,powerPreference:'high-performance'});
  if(!gl){fallback.style.display='grid';throw new Error('WebGL2 unavailable')}
  const hdrFloat=!!gl.getExtension('EXT_color_buffer_float');

    const LUT_W=1024,LUT_H=768,PHI_MAX=Math.PI*4,BETA_MAX=.78;
    const CAMERA_RADIUS=18,INITIAL_U=1/CAMERA_RADIUS;

    function integrateOrbitLut(){
      const orbit=new Float32Array(LUT_W*LUT_H);
      const phiEnd=new Float32Array(LUT_W);
      const dPhi=PHI_MAX/(LUT_H-1),subSteps=4,h=dPhi/subSteps;
      const deriv=(u,v)=>1.5*u*u-u;
      for(let x=0;x<LUT_W;x++){
        const beta=((x+.5)/LUT_W)*BETA_MAX;
        let u=INITIAL_U,v=beta<1e-5?1e6:INITIAL_U/Math.tan(beta),active=true,end=-1;
        for(let y=0;y<LUT_H;y++){
          orbit[y*LUT_W+x]=active?u:-1;
          if(!active)continue;
          for(let s=0;s<subSteps;s++){
            const k1u=v,k1v=deriv(u,v);
            const u2=u+.5*h*k1u,v2=v+.5*h*k1v,k2u=v2,k2v=deriv(u2,v2);
            const u3=u+.5*h*k2u,v3=v+.5*h*k2v,k3u=v3,k3v=deriv(u3,v3);
            const u4=u+h*k3u,v4=v+h*k3v,k4u=v4,k4v=deriv(u4,v4);
            u+=h*(k1u+2*k2u+2*k3u+k4u)/6;
            v+=h*(k1v+2*k2v+2*k3v+k4v)/6;
            if(!Number.isFinite(u)||u>=1){active=false;end=-1;break}
            if(v<0&&u<=.00035){active=false;end=(y+s/subSteps)*dPhi;break}
          }
        }
        phiEnd[x]=end;
      }
      return {orbit,phiEnd};
    }

    const lookup=integrateOrbitLut();
    const floatLinear=gl.getExtension('OES_texture_float_linear');
    function floatTexture(width,height,data,useLinear=true){
      const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
      const filter=useLinear&&floatLinear?gl.LINEAR:gl.NEAREST;
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.R32F,width,height,0,gl.RED,gl.FLOAT,data);
      return tex;
    }
    const orbitTexture=floatTexture(LUT_W,LUT_H,lookup.orbit,true);
    const phiTexture=floatTexture(LUT_W,1,lookup.phiEnd,false);

    const vertexSource=`#version 300 es
      layout(location=0) in vec2 aPosition;
      out vec2 vUv;
      void main(){vUv=aPosition*.5+.5;gl_Position=vec4(aPosition,0.0,1.0);}
    `;
    const fragmentSource=`#version 300 es
      precision highp float;
      uniform vec2 uResolution;
      uniform float uTime;
      uniform float uExposure;
      uniform float uYaw;
      uniform float uPitch;
      uniform float uRoll;
      uniform float uZoom;
      uniform float uTemperature;
      uniform float uThickness;
      uniform float uLensStrength;
      uniform float uChromatic;
      uniform vec3 uTint;
      uniform sampler2D uOrbitLut;
      uniform sampler2D uPhiEndLut;
      out vec4 outColor;
      #define PI 3.14159265359
      const float PHI_MAX=${PHI_MAX.toFixed(9)};
      const float BETA_MAX=${BETA_MAX.toFixed(6)};
      const float CAMERA_RADIUS=${CAMERA_RADIUS.toFixed(1)};
      const float CAPTURE_MODE=${captureMode?'1.0':'0.0'};

      float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1)),f.x),f.y);}
      float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.62,1.17,-1.17,1.62);for(int i=0;i<5;i++){v+=a*noise(p);p=m*p+17.3;a*=.5;}return v;}
      float billow(vec2 p){
        float v=0.0,a=.56;
        mat2 m=mat2(1.74,1.06,-1.06,1.74);
        for(int i=0;i<4;i++){
          float n=1.0-abs(noise(p)*2.0-1.0);
          v+=a*n*n;p=m*p+11.7;a*=.48;
        }
        return v;
      }
      float ridge(vec2 p){
        float n=abs(fbm(p)-.5);
        return pow(clamp(1.0-n*2.0,0.0,1.0),2.3);
      }

      float hash31(vec3 p){
        p=fract(p*.1031);p+=dot(p,p.yzx+33.33);
        return fract((p.x+p.y)*p.z);
      }
      float noise3(vec3 p){
        vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
        float n000=hash31(i),n100=hash31(i+vec3(1,0,0));
        float n010=hash31(i+vec3(0,1,0)),n110=hash31(i+vec3(1,1,0));
        float n001=hash31(i+vec3(0,0,1)),n101=hash31(i+vec3(1,0,1));
        float n011=hash31(i+vec3(0,1,1)),n111=hash31(i+vec3(1,1,1));
        return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
      }
      float fbm3(vec3 p){
        float v=0.0,a=.54;
        for(int i=0;i<3;i++){
          v+=a*noise3(p);
          p=vec3(p.y+p.z,p.z-p.x,p.x+p.y)*1.31+17.17;
          a*=.48;
        }
        return v;
      }
      vec2 hash22(vec2 p){
        float n=sin(dot(p,vec2(41.0,289.0)));
        return fract(vec2(262144.0,32768.0)*n);
      }
      float voronoiRing(float angle,float radius){
        const float CELLS=7.0;
        vec2 p=vec2(fract(angle/(2.0*PI)+.5)*CELLS,(radius-3.0)*.72);
        vec2 cell=floor(p),f=fract(p);float nearest=9.0;
        for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
          vec2 g=vec2(float(x),float(y)),id=cell+g;
          id.x=mod(id.x,CELLS);
          vec2 delta=g+hash22(id)-f;
          nearest=min(nearest,dot(delta,delta));
        }
        return sqrt(nearest);
      }
      vec3 volumeCloud(vec3 hit,float t,float lensOrder){
        float r=length(hit.xz),az=atan(hit.z,hit.x);
        vec2 loopA=vec2(cos(t),sin(t)),loopB=vec2(cos(t*2.0),sin(t*2.0));
        float omega=1.28/pow(r,1.5),flowAz=az-t*2.0;
        vec2 circle=vec2(cos(flowAz),sin(flowAz));
        // Blender node analogue:
        // Texture Coordinate -> 4D Noise (shape) -> Map Range (coverage)
        // -> high-frequency Noise subtraction (erosion) -> height gradient.
        float halfHeight=(.3+.105*r)*uThickness;
        float yn=hit.y/max(halfHeight,.001);
        vec3 domain=vec3(circle*.88,r*.145+yn*.18)+vec3(loopA*.075,loopB.x*.052);
        vec3 distortion=vec3(
          noise3(domain*.72+vec3(3.7,-6.2,1.4)),
          noise3(domain*.69+vec3(-8.1,2.6,5.3)),
          noise3(domain*.75+vec3(4.4,9.1,-3.2))
        )-.5;
        vec3 shapeP=domain+distortion*1.42;

        // Shape noise remains low-frequency and connected around the full ring.
        float shape=fbm3(shapeP);
        float coverage=smoothstep(.3,.68,shape);
        float surfacePuff=noise3(shapeP*1.82+vec3(6.4,-2.7,8.1));
        float centreShift=distortion.y*.34;
        float localTop=.86+.28*coverage;
        float profile=1.0-smoothstep(localTop*.5,localTop,abs(yn-centreShift));
        float baseDensity=profile*(.22+.78*coverage);

        // Detail noise erodes an already continuous macro volume. It can carve
        // pockets and cauliflower rims, but a dilute lower deck always remains.
        vec3 detailP=shapeP*3.55+vec3(yn*.55+loopB.x*.065,-yn*.37+loopB.y*.065,loopA.x*.075);
        float detail=fbm3(detailP);
        float ridged=pow(clamp(1.0-abs(detail*2.0-1.0),0.0,1.0),1.28);
        float erosion=(1.0-ridged)*(.16+.34*(1.0-baseDensity));
        float lowerDeck=exp(-2.9*(yn+.34)*(yn+.34));
        float density=max(.075*profile+.055*lowerDeck,baseDensity-erosion);
        density*=.58+.58*ridged;
        density*=.9+.16*surfacePuff;

        // Cycles-style heterogeneous volume footprint filtering close to the
        // photon orbit. It suppresses unresolved grain, not macro density.
        float orderSmooth=smoothstep(.9,2.55,lensOrder);
        density=mix(density,(.36+.38*shape)*profile,orderSmooth*.9);

        // Four-tap density march towards the inner hot flow approximates Volume
        // Absorption / Scatter self-shadowing (Beer-Lambert transmittance).
        vec3 lightStep=normalize(vec3(-.38,.68,.34));
        float od=density;
        od+=.72*smoothstep(.3,.68,fbm3(shapeP+lightStep*.34))*profile;
        od+=.48*smoothstep(.3,.68,noise3(shapeP+lightStep*.72))*profile;
        od+=.28*smoothstep(.3,.68,noise3(shapeP+lightStep*1.18))*profile;
        float lightTransmittance=exp(-.38*od);
        // Return raw monochrome structure separately from colour. Every preset
        // receives the same density relief even when chromatic dispersion is 0.
        float relief=clamp(ridged*.82+detail*.18,0.0,1.0);
        relief=mix(relief,.58,orderSmooth);
        return vec3(clamp(density,0.0,1.18),relief,lightTransmittance);
      }

      float sampleOrbit(float beta,float phi){
        if(phi<0.0||phi>PHI_MAX||beta<0.0||beta>BETA_MAX)return -1.0;
        vec2 uv=vec2(clamp(beta/BETA_MAX,0.0,1.0),clamp(phi/PHI_MAX,0.0,1.0));
        return max(texture(uOrbitLut,uv).r,0.0);
      }
      vec2 sampleLensExit(float beta){
        float x=clamp(beta/BETA_MAX,0.0,1.0)*1023.0;
        int x0=int(floor(x)),x1=min(x0+1,1023);float f=fract(x);
        float a=texelFetch(uPhiEndLut,ivec2(x0,0),0).r,b=texelFetch(uPhiEndLut,ivec2(x1,0),0).r;
        float va=step(0.0,a),vb=step(0.0,b);
        float escape=mix(va,vb,smoothstep(0.0,1.0,f));
        float phi=(va>0.5&&vb>0.5)?mix(a,b,f):(va>0.5?a:b);
        return vec2(phi,escape);
      }

      float sampleEscape(float beta){return sampleLensExit(clamp(beta,0.0,BETA_MAX)).y;}

      vec3 skyColor(vec3 d,float t){
        d=normalize(d);float lon=atan(d.z,d.x)/(2.0*PI)+.5,lat=asin(clamp(d.y,-1.,1.))/PI+.5;
        vec2 uv=vec2(lon,lat);
        vec3 col=vec3(.00018,.00035,.0008);
        vec3 galacticNormal=normalize(vec3(.31,.87,.38));
        float galacticDensity=exp(-pow(dot(d,galacticNormal)/.055,2.0));
        for(int i=0;i<3;i++){
          float fi=float(i),scale=vec3(260.,510.,930.)[i];vec2 q=uv*scale,cell=floor(q),gv=fract(q)-.5;
          float h=hash21(cell+fi*31.7),threshold=mix(.989,.968,galacticDensity/(1.0+fi*.45));
          float s=exp(-dot(gv,gv)/(mix(.0024,.00038,fi/2.0)))*smoothstep(threshold,.9997,h);
          s*=mix(1.0,.42,uChromatic);
          col+=s*mix(vec3(.42,.66,1.2),vec3(1.25,.85,.48),hash21(cell+8.2));
        }
        return col;
      }

      vec3 planckRgb(float temperature){
        vec3 nm=vec3(680.,550.,440.);
        vec3 x=1.4387769e7/(nm*max(temperature,900.));
        vec3 b=1.0e16/(pow(nm,vec3(5.0))*(exp(min(x,vec3(70.0)))-1.0));
        float peak=max(max(b.r,b.g),b.b);
        return b/max(peak,1e-8);
      }

      vec3 discEmissionLegacy(vec3 hit,vec3 cameraPos,float t,float lensOrder){
        float r=length(hit.xz),az=atan(hit.z,hit.x);
        float edge=max(1.0-sqrt(3.0/r),0.0);
        float tempShape=pow(3.0/r,.76)*pow(edge,.24);

    captureNext.onclick=()=>{forcedCaptureFrame=(forcedCaptureFrame+1)%spriteFrameCount;lastDraw=-FRAME_MS};
    window.__blackHoleStats={targetFps:TARGET_FPS,draws:0,startedAt:performance.now(),width:0,height:0};
    function resize(){const rect=canvas.getBoundingClientRect(),scale=window.innerWidth < 700 ? .72 : .9,dpr=Math.min(window.devicePixelRatio||1,scale);const w=Math.max(2,Math.floor(rect.width*dpr)),h=Math.max(2,Math.floor(rect.height*dpr));if(w!==lastWidth||h!==lastHeight){canvas.width=w;canvas.height=h;lastWidth=w;lastHeight=h;window.__blackHoleStats.width=w;window.__blackHoleStats.height=h;deleteTarget(sceneTarget);deleteTarget(blurA);deleteTarget(blurB);sceneTarget=colorTarget(w,h);const bw=Math.max(2,Math.floor(w/4)),bh=Math.max(2,Math.floor(h/4));blurA=colorTarget(bw,bh);blurB=colorTarget(bw,bh);}}
    function bindTexture(program,name,unit,texture){gl.useProgram(program);gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,texture);gl.uniform1i(gl.getUniformLocation(program,name),unit);}
    function render(now){
      resize();
      if(!paused&&(!document.hidden||captureMode)&&now-lastDraw>=FRAME_MS){
        lastDraw=now;window.__blackHoleStats.draws++;
        // Every temporal shader input is derived from this phase angle. The
        // entire cloud field therefore returns to exactly the same state at TAU.
        const elapsed=(now-start-pausedTotal)*.001;
        const t=(captureMode?forcedCaptureFrame/spriteFrameCount:(elapsed%animationLoopSeconds)/animationLoopSeconds)*Math.PI*2;
        // Bloom belongs to the optical object, not to a fixed pixel radius.
        // Normalize to the default camera/lens pair and scale both blur passes.
        const opticalScale=Math.max(.12,Math.min(2.8,labState.zoom*labState.lens/(1.04*1.30)));
        gl.bindFramebuffer(gl.FRAMEBUFFER,sceneTarget.fbo);gl.viewport(0,0,sceneTarget.width,sceneTarget.height);gl.useProgram(sceneProgram);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,orbitTexture);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,phiTexture);gl.uniform2f(resolutionLoc,sceneTarget.width,sceneTarget.height);gl.uniform1f(timeLoc,t);gl.uniform1f(exposureLoc,labState.exposure*(boost?1.28:1));gl.uniform1f(yawLoc,labState.yaw*Math.PI/180);gl.uniform1f(pitchLoc,labState.pitch*Math.PI/180);gl.uniform1f(rollLoc,labState.roll*Math.PI/180);gl.uniform1f(zoomLoc,labState.zoom);gl.uniform1f(temperatureLoc,labState.temperature);gl.uniform1f(thicknessLoc,labState.thickness);gl.uniform1f(lensStrengthLoc,labState.lens);gl.uniform1f(chromaticLoc,labState.chroma);gl.uniform3fv(tintLoc,labState.tint);gl.drawArrays(gl.TRIANGLES,0,6);
        gl.bindFramebuffer(gl.FRAMEBUFFER,blurA.fbo);gl.viewport(0,0,blurA.width,blurA.height);bindTexture(blurProgram,'uImage',2,sceneTarget.texture);gl.uniform2f(gl.getUniformLocation(blurProgram,'uTexel'),1/sceneTarget.width,1/sceneTarget.height);gl.uniform2f(gl.getUniformLocation(blurProgram,'uDirection'),1,0);gl.uniform1f(gl.getUniformLocation(blurProgram,'uThreshold'),.46);gl.uniform1f(gl.getUniformLocation(blurProgram,'uRadiusScale'),opticalScale);gl.drawArrays(gl.TRIANGLES,0,6);
        gl.bindFramebuffer(gl.FRAMEBUFFER,blurB.fbo);bindTexture(blurProgram,'uImage',2,blurA.texture);gl.uniform2f(gl.getUniformLocation(blurProgram,'uTexel'),1/blurA.width,1/blurA.height);gl.uniform2f(gl.getUniformLocation(blurProgram,'uDirection'),0,1);gl.uniform1f(gl.getUniformLocation(blurProgram,'uThreshold'),-1);gl.uniform1f(gl.getUniformLocation(blurProgram,'uRadiusScale'),opticalScale);gl.drawArrays(gl.TRIANGLES,0,6);
        gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);bindTexture(compositeProgram,'uScene',2,sceneTarget.texture);bindTexture(compositeProgram,'uBloom',3,blurB.texture);gl.uniform1f(gl.getUniformLocation(compositeProgram,'uBloomGain'),labState.bloom*(boost?1.35:1));gl.drawArrays(gl.TRIANGLES,0,6);if(captureMode){captureContext.clearRect(0,0,384,216);captureContext.drawImage(canvas,0,0,384,216);captureExport.dataset.frame=String(forcedCaptureFrame);if(batchMode&&!batchBusy){batchSheetContext.drawImage(captureCanvas,(forcedCaptureFrame%8)*384,Math.floor(forcedCaptureFrame/8)*216);if(forcedCaptureFrame===0)batchPosterContext.drawImage(captureCanvas,0,0);captureExport.dataset.batch=`${batchPalettes[batchPaletteIndex]}:${forcedCaptureFrame}`;if(forcedCaptureFrame<spriteFrameCount-1){forcedCaptureFrame+=1;lastDraw=-FRAME_MS}else{batchBusy=true;finishBatchPalette().catch(error=>{captureExport.dataset.batch=`error:${error.message}`})}}else if(!batchMode)captureExport.href=captureCanvas.toDataURL('image/png');}
      }
      requestAnimationFrame(render);
    }
    const controlIds=['yaw','pitch','roll','zoom','temperature','exposure','bloom','thickness','lens','chroma'];
    const controlsById=Object.fromEntries(controlIds.map(id=>[id,document.querySelector('#'+id)]));
    const tintInput=document.querySelector('#tint');
    function hexTint(hex){const n=parseInt(hex.slice(1),16);return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255]}
    function outputText(id,value){
      if(id==='yaw'||id==='pitch'||id==='roll')return Math.round(value)+'°';
      if(id==='temperature')return Math.round(value)+'K';
      return Number(value).toFixed(2);
    }
    function readLab(){
      for(const id of controlIds){const value=parseFloat(controlsById[id].value);labState[id]=value;controlsById[id].nextElementSibling.value=outputText(id,value)}
      labState.tint=hexTint(tintInput.value);
    }
    function setLab(values){
      for(const [id,value] of Object.entries(values)){if(id==='tint')tintInput.value=value;else if(controlsById[id])controlsById[id].value=String(value)}
      readLab();
    }
    for(const input of [...Object.values(controlsById),tintInput])input.addEventListener('input',readLab);
    const presets={
      gold:{yaw:0,pitch:9,roll:0,zoom:1.03,temperature:5600,exposure:.9,bloom:.85,thickness:1.32,lens:1.22,chroma:0,tint:'#ffd39a'},
      blue:{yaw:28,pitch:7,roll:-5,zoom:1.06,temperature:9400,exposure:1.24,bloom:2.8,thickness:.88,lens:1.28,chroma:.18,tint:'#a8efff'},
      violet:{yaw:-34,pitch:22,roll:12,zoom:1.02,temperature:7600,exposure:1.08,bloom:2.05,thickness:1.18,lens:1.45,chroma:.34,tint:'#bd88ff'},
      red:{yaw:52,pitch:-16,roll:-11,zoom:.96,temperature:3200,exposure:.98,bloom:1.4,thickness:1.55,lens:1.62,chroma:.08,tint:'#ff684c'},
      spectrum:{yaw:0,pitch:8,roll:0,zoom:1.04,temperature:7600,exposure:.96,bloom:1.15,thickness:1.42,lens:1.28,chroma:1,tint:'#f6f0ff'},
      gameGold:{yaw:0,pitch:8,roll:0,zoom:.84,temperature:5600,exposure:1.0,bloom:1.42,thickness:1.42,lens:1.28,chroma:.2,tint:'#ffd39a'},
      gameBlue:{yaw:0,pitch:8,roll:0,zoom:.84,temperature:9400,exposure:1.14,bloom:2.15,thickness:1.42,lens:1.28,chroma:.32,tint:'#a8efff'},
      gameViolet:{yaw:0,pitch:8,roll:0,zoom:.84,temperature:7600,exposure:.96,bloom:1.15,thickness:1.42,lens:1.28,chroma:1,tint:'#f6f0ff'},
      gameRed:{yaw:0,pitch:8,roll:0,zoom:.84,temperature:3600,exposure:1.04,bloom:1.56,thickness:1.42,lens:1.28,chroma:.28,tint:'#ff684c'}
    };
    document.querySelectorAll('.preset').forEach(button=>button.addEventListener('click',()=>setLab(presets[button.dataset.preset])));
    document.querySelector('#resetLab').addEventListener('click',()=>setLab(presets.spectrum));
    document.querySelector('#randomize').addEventListener('click',()=>{
      const colors=['#ffd39a','#86d8ff','#bd88ff','#ff684c','#78ffd5','#f8a8ff'];
      setLab({yaw:-180+Math.random()*360,pitch:-48+Math.random()*96,roll:-35+Math.random()*70,zoom:.3+Math.random()*1.08,temperature:2600+Math.random()*7000,exposure:.7+Math.random()*.65,bloom:.65+Math.random()*1.55,thickness:.65+Math.random()*1.1,lens:.7+Math.random()*1.35,chroma:.18+Math.random()*.82,tint:colors[Math.floor(Math.random()*colors.length)]});
    });
    let dragging=false,lastPointerX=0,lastPointerY=0;
    canvas.addEventListener('pointerdown',event=>{dragging=true;lastPointerX=event.clientX;lastPointerY=event.clientY;canvas.classList.add('dragging');canvas.setPointerCapture(event.pointerId)});
    canvas.addEventListener('pointermove',event=>{if(!dragging)return;const dx=event.clientX-lastPointerX,dy=event.clientY-lastPointerY;lastPointerX=event.clientX;lastPointerY=event.clientY;const yaw=Math.max(-180,Math.min(180,parseFloat(controlsById.yaw.value)+dx*.42));const pitch=Math.max(-70,Math.min(70,parseFloat(controlsById.pitch.value)-dy*.34));setLab({yaw,pitch})});
    const stopDrag=()=>{dragging=false;canvas.classList.remove('dragging')};canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
    document.querySelectorAll('input').forEach(input=>input.setAttribute('autocomplete','off'));
    const initialPreset=presets[query.get('preset')]||presets.spectrum;
    setLab(initialPreset);
    window.addEventListener('pageshow',()=>setLab(initialPreset),{once:true});
    document.querySelector('#pause').onclick=(e)=>{paused=!paused;if(paused)pauseAt=performance.now();else pausedTotal+=performance.now()-pauseAt;e.currentTarget.textContent=paused?'继续动画':'暂停动画'};
    document.querySelector('#contrast').onclick=(e)=>{boost=!boost;e.currentTarget.textContent=boost?'恢复曝光':'增强曝光'};
    window.addEventListener('resize',resize,{passive:true});requestAnimationFrame(render);
  </script>
