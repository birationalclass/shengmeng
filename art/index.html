<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a0a0b">
  <meta name="description" content="Art — Sheng Meng 的影像与音乐作品。">
  <title>Art · Sheng Meng</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="art.css"><script type="module" src="app.js?v=20261008-v7"></script>
</head>
<body>
  <header><a href="../" class="home-link">SHENG MENG <span>↗</span></a><span class="wordmark">ART</span><button id="lock" class="quiet" hidden>锁定 ↗</button></header>
  <main>
    <section id="gate" class="gate" aria-labelledby="gate-title">
      <div class="gate-mark" aria-hidden="true"><span></span><i></i><b></b></div>
      <p class="eyebrow">MOVING IMAGES / MUSIC</p><h1 id="gate-title">Art<span>.</span></h1>
      <form id="unlock-form">
        <label for="password">访问密码</label>
        <div class="password-row"><input id="password" name="password" type="password" autocomplete="off" required spellcheck="false" aria-describedby="gate-error"><button id="unlock" type="submit">进入 <span>→</span></button></div>
        <p id="gate-error" class="message" role="status" aria-live="polite"></p>
      </form>
      <noscript><p>请启用 JavaScript 以打开作品。</p></noscript>
    </section>
    <section id="gallery" class="gallery" hidden aria-labelledby="work-title">
      <div class="work-heading"><div><p class="eyebrow">01 / MUSIC VIDEO</p><h1 id="work-title"></h1></div><p class="byline">OPENAI <span>·</span> 2026</p></div>
      <div class="screen"><video id="video" playsinline preload="none" aria-label="音乐视频"></video><button id="play" class="play" aria-label="播放 MV"><span>▶</span><b>播放 MV</b></button></div>
      <p id="video-status" class="message" role="status" aria-live="polite"></p>
      <div class="music-row"><div><p class="eyebrow">SOUNDTRACK</p><h2>Music.</h2></div><audio id="audio" controls preload="none" aria-label="音乐试听" hidden></audio><div class="music-actions"><button id="listen" class="quiet">试听 ↗</button><button id="download" class="download">下载 MP3 <span>↓</span></button></div></div>
      <p id="music-status" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer><span>ART / SHENG MENG</span><span>IMAGES IN MOTION.</span></footer>
</body>
</html>
