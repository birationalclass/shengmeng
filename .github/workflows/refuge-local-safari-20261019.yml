          "run": "python3 - <<'PY'\nimport os,json,urllib.request,hashlib,concurrent.futures,time\nfrom pathlib import Path\ncfg=json.loads(os.environ['REFUGE_PACKAGE_CONFIG']);ROOT=Path(os.environ['RUNNER_TEMP'])/'refuge-local-verified';STAGE=ROOT/'stage';FIX=ROOT/'fix';STAGE.mkdir(parents=True,exist_ok=True);FIX.mkdir(exist_ok=True)\ndef get(url,token=False):\n headers={'User-Agent':'Math-Refuge-verified-local-package'}\n if token:headers['Authorization']='Bearer '+os.environ['GH_TOKEN'];headers['Accept']='application/vnd.github+json'\n return urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=120)\ndef filehash(p):\n h=hashlib.sha256()\n with p.open('rb') as f:\n  for b in iter(lambda:f.read(4*1024*1024),b''):h.update(b)\n return h.hexdigest()\nprint('Downloading the existing public source package',flush=True)\noriginal=STAGE/'math-refuge-local.original.zip'\nwith get(cfg['sourceURL']) as response,original.open('wb') as out:\n for chunk in iter(lambda:response.read(4*1024*1024),b''):out.write(chunk)\nassert filehash(original)==cfg['sourceSha256']\ndef one(row):\n assert row['path'].startswith('visuals/math-refuge/') and '..' not in Path(row['path']).parts\n with get('https://raw.githubusercontent.com/birationalclass/shengmeng/'+cfg['sourceCommit']+'/'+row['path']) as r:b=r.read()\n assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()==row['sha']\n p=ROOT/'overlay'/row['path'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);return dict(path=row['path'],file=str(p))\nwith concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:listing=list(pool.map(one,cfg['files']))\n(FIX/'发布提交.json').write_text(json.dumps({'sha':cfg['sourceCommit']}),'utf8');(FIX/'发布清单.json').write_text(json.dumps(listing),'utf8')\n\nfrom pathlib import Path,PurePosixPath\nimport json,zipfile,copy,hashlib,re,stat,time\nPREFIX='math-refuge-local/'\noriginal=STAGE/'math-refuge-local.original.zip';target=STAGE/'math-refuge-local-safari-20261019.zip';release=json.loads((FIX/'发布提交.json').read_text('utf8'));commit=release['sha']\nlisting=json.loads((FIX/'发布清单.json').read_text('utf8'));overlay={r['path']:Path(r['file']).read_bytes() for r in listing};assert all(p.startswith('visuals/math-refuge/') for p in overlay)\nassert not any(Path(p).suffix.lower() in ['.mp3','.wav','.pt','.safetensors','.onnx'] for p in overlay)\ndef sha(b):return hashlib.sha256(b).hexdigest()\nwith zipfile.ZipFile(original) as src:\n names=src.namelist();assert len(names)==len(set(names))\n for name in names:\n  p=PurePosixPath(name);assert name.startswith(PREFIX) and '..' not in p.parts and not p.is_absolute()\n  mode=src.getinfo(name).external_attr>>16;assert not stat.S_ISLNK(mode),('Unexpected symlink',name)\n oldChecks=json.loads(src.read(PREFIX+'SHA256SUMS.json'))\n oldIndex=src.read(PREFIX+'visuals/math-refuge/index.html').decode('utf8');newIndex=overlay['visuals/math-refuge/index.html'].decode('utf8')\n wrapper=re.search(r'<head>(<script>window\\.REFUGE_LOCAL=true;.*?</script>)',oldIndex,re.S);assert wrapper\n newIndex=newIndex.replace('<head>','<head>'+wrapper.group(1),1)\n newIndex,count=re.subn(r'<script type=\"module\" src=\"refuge-social\\.js[^\\\"]*\"></script>','<script type=\"module\" src=\"local-entry.js\"></script>',newIndex);assert count==1\n newIndex=newIndex.replace('<a href=\"../\" class=\"back\"','<a href=\"https://birationalclass.github.io/shengmeng/visuals/\" class=\"back\"',1)\n assert 'window.REFUGE_LOCAL=true;' in newIndex and 'src=\"local-entry.js\"' in newIndex\n overlay['visuals/math-refuge/index.html']=newIndex.encode('utf8')\n readme=src.read(PREFIX+'README.txt').decode('utf8');readme,count=re.subn(r'源版本：[a-f0-9]{40}', '源版本：'+commit,readme);assert count==1\n readme+='\\n本次更新：2026-10-19 Safari 黑板编号与字形显示兼容修订。\\n';overlay['README.txt']=readme.encode('utf8')\n note=dict(sourceCommit=commit,basePackageCommit=oldChecks['sourceCommit'],date='2026-10-19',kind='safari-glyph-compatibility',audioRegenerated=False,launchersPreserved=True,patchedFiles=sorted(overlay))\n overlay['PACKAGE_UPDATE.json']=(json.dumps(note,ensure_ascii=False,indent=2)+'\\n').encode('utf8')\n hashes={};changed=[];unchanged=0;processed=0\n with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as out:\n  for info in src.infolist():\n   short=info.filename.removeprefix(PREFIX)\n   if short=='SHA256SUMS.json':continue\n   if info.is_dir():out.writestr(copy.copy(info),b'');continue\n   h=hashlib.sha256();data=overlay.pop(short,None)\n   if data is not None:\n    old=src.read(info.filename);assert oldChecks['files'].get(short)==sha(old),('Original file checksum differs',short)\n    replacement=copy.copy(info);replacement.date_time=(2026,10,19,0,0,0);out.writestr(replacement,data);h.update(data)\n    if data!=old:changed.append(short)\n    else:unchanged+=1\n   else:\n    with src.open(info) as inp,out.open(copy.copy(info),'w',force_zip64=True) as dest:\n     for chunk in iter(lambda:inp.read(1024*1024),b''):dest.write(chunk);h.update(chunk)\n    assert oldChecks['files'].get(short)==h.hexdigest(),('Original file checksum differs',short);unchanged+=1\n   hashes[short]=h.hexdigest();processed+=1\n   if processed%1000==0:print('REPACKED',processed,'files',flush=True)\n  for short,data in overlay.items():\n   info=zipfile.ZipInfo(PREFIX+short,date_time=(2026,10,19,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.create_system=3;info.external_attr=0o100644<<16;out.writestr(info,data);hashes[short]=sha(data);changed.append(short)\n  manifest=dict(sourceCommit=commit,basePackageCommit=oldChecks['sourceCommit'],updated='2026-10-19',files=hashes)\n  out.writestr(PREFIX+'SHA256SUMS.json',(json.dumps(manifest,ensure_ascii=False,indent=2)+'\\n').encode('utf8'))\n launcher=src.getinfo(PREFIX+'Start-Mac.command');assert (launcher.external_attr>>16)&0o111,('Mac launcher is not executable',launcher.external_attr)\nresult=dict(file=str(target),bytes=target.stat().st_size,sourceCommit=commit,files=len(hashes),changedFiles=changed,unchangedFiles=unchanged,sourceAudioUnchanged=True,macLauncherMode=oct(launcher.external_attr>>16))\n(STAGE/'重打包记录.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\\n','utf8');print('PACKAGE_BUILT',json.dumps({k:v for k,v in result.items() if k!='changedFiles'},ensure_ascii=False),flush=True)\n\n\nimport zipfile,urllib.parse\nwith zipfile.ZipFile(target) as z:\n assert z.testzip() is None\n checksumManifest=z.read('math-refuge-local/SHA256SUMS.json')\n assert hashlib.sha256(checksumManifest).hexdigest()==cfg['expectedManifest'],'Generated file manifest differs from the locally verified package'\nsize=target.stat().st_size;checksum=filehash(target)\nAPI='https://api.github.com/repos/birationalclass/shengmeng'\ndef api(path,data=None,method=None):\n body=None if data is None else json.dumps(data).encode();headers={'User-Agent':'Math-Refuge-verified-local-package','Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}\n with urllib.request.urlopen(urllib.request.Request(API+path,data=body,headers=headers,method=method),timeout=120) as r:return json.load(r)\nrelease=api('/releases/'+str(cfg['releaseId']));assert release['tag_name']=='math-refuge-local-20261019'\ndef upload(name,content,mime,length):\n old=next((a for a in api('/releases/'+str(cfg['releaseId']))['assets'] if a['name']==name),None)\n if old:\n  if old['state']=='starter' and old['size']==0:api('/releases/assets/'+str(old['id']),method='DELETE')\n  elif old['state']=='uploaded':return old\n  else:raise RuntimeError('Unexpected existing destination asset')\n url=release['upload_url'].split('{')[0]+'?'+urllib.parse.urlencode({'name':name})\n headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'Math-Refuge-verified-local-package','Accept':'application/vnd.github+json','Content-Type':mime,'Content-Length':str(length)}\n with urllib.request.urlopen(urllib.request.Request(url,data=content,headers=headers,method='POST'),timeout=600) as r:return json.load(r)\nprint('Uploading verified package from GitHub runner',size,checksum,flush=True)\nwith target.open('rb') as f:asset=upload(target.name,f,'application/zip',size)\nassert asset['size']==size and asset['digest']=='sha256:'+checksum\ntext=(checksum+'  '+target.name+'\\n').encode();checksumAsset=upload(target.name+'.sha256',text,'text/plain',len(text));assert checksumAsset['digest']=='sha256:'+hashlib.sha256(text).hexdigest()\nreport=dict(sourceCommit=cfg['sourceCommit'],manifestSha256=cfg['expectedManifest'],sha256=checksum,bytes=size,assetId=asset['id'],files=len(manifest['files']),allLocalFileHashesMatched=True,sourcePackageSha256=cfg['sourceSha256'],macLauncherMode=oct(launcher.external_attr>>16))\nbody=json.dumps(report,ensure_ascii=False,indent=2).encode();upload(target.name+'-build.json',body,'application/json',len(body));print('SERVER_BUILD_COMPLETE',json.dumps(report),flush=True)\n\nPY"
