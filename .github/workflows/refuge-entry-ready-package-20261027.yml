{
  "name": "Build verified mainland-ready Math Refuge offline ZIP",
  "on": {
    "push": {
      "branches": [
        "codex/refuge-entry-ready-package-20261027"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "package": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "Rebuild locally verified network-independent classroom package",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "RINGS_PACKAGE_CONFIG_URL": "https://raw.githubusercontent.com/birationalclass/shengmeng/${{ github.sha }}/.github/refuge-package/entry-ready-20261027.json"
          },
          "run": "python3 - <<'PY'\n\nfrom pathlib import Path, PurePosixPath\nimport base64, concurrent.futures, hashlib, json, os, shutil, stat, time\nimport urllib.request, urllib.parse, zipfile\n\ndef digest(file):\n    h=hashlib.sha256()\n    with Path(file).open('rb') as stream:\n        for block in iter(lambda:stream.read(2**20),b''):h.update(block)\n    return h.hexdigest()\n\ndef byte_sha(data):return hashlib.sha256(data).hexdigest()\n\ndef fetch(url, destination=None):\n    for attempt in range(4):\n        try:\n            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Math-Refuge-rings-package'}),timeout=180) as response:\n                if destination:\n                    with Path(destination).open('wb') as stream:shutil.copyfileobj(response,stream,2**20)\n                    return None\n                return response.read()\n        except Exception:\n            if attempt==3:raise\n            time.sleep(2**attempt)\n\ndef safe_public_path(path):\n    p=PurePosixPath(path)\n    assert (p.is_relative_to('visuals/math-refuge') or p.is_relative_to('visuals/blackboard')) and '..' not in p.parts,path\n    forbidden=['.git','.env','原始','逐句','模型','参考条件','缓存','花名册','roster','.wav','.pt','.pth','.safetensors','.ckpt','.onnx']\n    assert not any(x.lower() in path.lower() for x in forbidden),path\n    return p\n\ndef build_verified_zip(folder,target,cfg):\n    paths=sorted((p for p in folder.rglob('*') if p.is_file() and p.name!='SHA256SUMS.json'),key=lambda p:p.relative_to(folder).as_posix())\n    assert not any(p.is_symlink() for p in paths)\n    hashes={p.relative_to(folder).as_posix():digest(p) for p in paths}\n    content=(json.dumps(dict(sourceCommit=cfg['sourceCommit'],updated='2026-10-27',files=hashes),ensure_ascii=False,sort_keys=True,indent=2)+'\\n').encode('utf8')\n    (folder/'SHA256SUMS.json').write_bytes(content)\n    assert byte_sha(content)==cfg['expectedManifest'],'Runner file manifest differs from locally verified package'\n    assert len(hashes)==cfg['expectedFiles'],'Unexpected package file count'\n    with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as archive:\n        for name in sorted([*hashes,'SHA256SUMS.json']):\n            executable=name in ['Start-Mac.command','Start-Linux.sh'] or name.startswith('runtime/refuge-') and not name.endswith('.json')\n            item=zipfile.ZipInfo('math-refuge-local/'+name,(2026,10,27,0,0,0));item.compress_type=zipfile.ZIP_DEFLATED;item.create_system=3\n            item.external_attr=(0o100755 if executable else 0o100644)<<16\n            archive.writestr(item,(folder/name).read_bytes())\n    with zipfile.ZipFile(target) as archive:assert archive.testzip() is None\n    return dict(sourceCommit=cfg['sourceCommit'],name=target.name,bytes=target.stat().st_size,sha256=digest(target),manifestSha256=byte_sha(content),files=len(hashes),audioFiles=sum(n.endswith(('.mp3','.wav','.ogg')) for n in hashes),uncompressedBytes=sum(p.stat().st_size for p in paths)+len(content),allLocalFileHashesMatched=True,nativeInstallRequired=False,privateAssetsIncluded=False,courses=5,namespace='rings-20261022')\n\ndef runner(cfg):\n    assert cfg['name']=='math-refuge-local-mainland-entry-ready-20261027.zip'\n    assert cfg['preserveExistingReleaseAssets'] is True\n    root=Path(os.environ['RUNNER_TEMP'])/'refuge-mainland-package-20261026';root.mkdir()\n    folder=root/'math-refuge-local';old=root/'previous.zip'\n    fetch(cfg['sourceURL'],old);assert digest(old)==cfg['sourceSha256']\n    with zipfile.ZipFile(old) as archive:\n        for item in archive.infolist():\n            parts=PurePosixPath(item.filename).parts\n            assert parts and parts[0]=='math-refuge-local' and '..' not in parts\n            assert not stat.S_ISLNK(item.external_attr>>16)\n        previous=json.loads(archive.read('math-refuge-local/SHA256SUMS.json'))\n        archive.extractall(root)\n    def overlay(row):\n        path=row['path'];safe_public_path(path)\n        url='https://raw.githubusercontent.com/birationalclass/shengmeng/'+cfg['sourceCommit']+'/'+urllib.parse.quote(path,safe='/')\n        data=fetch(url)\n        assert len(data)==row['bytes'] and byte_sha(data)==row['sha256'],path\n        assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()==row['sha'],path\n        target=folder/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)\n    with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(overlay,cfg['overlays']))\n    embedded_allowed={'PACKAGE_UPDATE.json', 'visuals/blackboard/index.html', 'visuals/math-refuge/index.html', 'visuals/math-refuge/sylow-f-classroom.html', 'visuals/math-refuge/assets/rosters/algebra-i.json', 'README.txt'}\n    assert set(cfg['embedded'])==embedded_allowed\n    for name,encoded in cfg['embedded'].items():\n        target=folder/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(base64.b64decode(encoded))\n    preserved=[]\n    for name,expected in previous['files'].items():\n        if name.endswith(('.mp3','.wav','.ogg')) or name.startswith('runtime/'):\n            assert digest(folder/name)==expected,('A prior audio file or native runtime changed',name)\n            if name.endswith(('.mp3','.wav','.ogg')):preserved.append(name)\n    target=root/cfg['name'];report=build_verified_zip(folder,target,cfg)\n    report['previousAudioPreserved']=len(preserved)\n    api='https://api.github.com/repos/birationalclass/shengmeng'\n    headers={'User-Agent':'Math-Refuge-rings-package','Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']}\n    def request(path):\n        with urllib.request.urlopen(urllib.request.Request(api+path,headers=headers),timeout=90) as response:return json.load(response)\n    release=request('/releases/tags/'+cfg['releaseTag'])\n    def existing_assets():\n        assets=[];page=1\n        while True:\n            batch=request('/releases/'+str(release['id'])+'/assets?per_page=100&page='+str(page));assets.extend(batch)\n            if len(batch)<100:return {a['name']:a for a in assets}\n            page+=1\n    def upload(name,data,mime,size):\n        assert name not in existing_assets(),'Destination already exists; never replace an older asset'\n        url=release['upload_url'].split('{')[0]+'?name='+urllib.parse.quote(name)\n        with urllib.request.urlopen(urllib.request.Request(url,data=data,headers={**headers,'Content-Type':mime,'Content-Length':str(size)},method='POST'),timeout=900) as response:return json.load(response)\n    names=existing_assets()\n    if cfg['name'] in names:\n        asset=names[cfg['name']]\n        assert asset.get('digest')=='sha256:'+report['sha256'] and asset['size']==report['bytes'],'Existing versioned ZIP differs; refusing replacement'\n    else:\n        with target.open('rb') as stream:asset=upload(cfg['name'],stream,'application/zip',report['bytes'])\n    assert asset.get('digest')=='sha256:'+report['sha256']\n    report.update(assetId=asset['id'],releaseId=release['id'])\n    checksum=(report['sha256']+'  '+cfg['name']+'\\n').encode('ascii')\n    build=(json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2)+'\\n').encode('utf8')\n    for name,data,mime in [(cfg['name']+'.sha256',checksum,'text/plain'),(cfg['name']+'-build.json',build,'application/json')]:\n        present=existing_assets().get(name)\n        if present:\n            assert present.get('digest')=='sha256:'+byte_sha(data),'Existing sidecar differs; refusing replacement'\n        else:upload(name,data,mime,len(data))\n    print('RINGS_PACKAGE_RELEASED',json.dumps(report,ensure_ascii=False),flush=True)\n\ncfg=json.loads(fetch(os.environ[\"RINGS_PACKAGE_CONFIG_URL\"]))\nrunner(cfg)\n\nPY"
        }
      ]
    }
  }
}
