l,data=data,headers={**headers,'Content-Type':mime,'Content-Length':str(size)},method='POST'),timeout=600) as r:return json.load(r)\n with target.open('rb') as f:asset=upload(target.name,f,'application/zip',report['bytes'])\n assert asset['digest']=='sha256:'+report['sha256'];report.update(assetId=asset['id'],allLocalFileHashesMatched=True,nativeInstallRequired=False,macArchitectures=['arm64','amd64'])\n checksum=(report['sha256']+'  '+target.name+'\\n').encode();upload(target.name+'.sha256',checksum,'text/plain',len(checksum));b=json.dumps(report,indent=2).encode();upload(target.name+'-build.json',b,'application/json',len(b));print('PUBLISHED_NATIVE_PACKAGE',json.dumps(report),flush=True)\n\nrunner(json.loads(os.environ['REFUGE_NATIVE_PACKAGE_CONFIG']))\n\nPY"
