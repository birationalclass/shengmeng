const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;

const win = (t, a, b, fi = .5, fo = .5) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));

const F_EN = '"Cinzel", "Times New Roman", serif';
const F_IT = '"Cormorant Garamond", "Times New Roman", serif';
const F_MATH = '"STIX Two Text", "Cambria Math", "Times New Roman", serif';

function text(s, x, y, o = {}) {

  ctx.font = `${o.style || ''} ${o.weight || 400} ${o.size || 40}px ${o.font || F_ZH}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';

}
function goldGrad(x0, y0, x1, y1, s) {

  g.addColorStop(0, '#6e4b1b'); g.addColorStop(.35, '#d9b25c');
  if (s > .05 && s < .95) { g.addColorStop(s - .05, '#e7c574'); g.addColorStop(s, '#fff6dc'); g.addColorStop(s + .05, '#e7c574'); }

}
function glowDot(x, y, r, col, a = 1) {

  g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.18, col.replace('A', a * .9)); g.addColorStop(1, col.replace('A', 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function hexA(hex) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},A)`; }

// ======================================================================== WebGL: backdrops + film post-processing
const glc = document.createElement('canvas'); glc.width = RW; glc.height = RH;
const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
const VS = `#version 300 es
in vec2 p; out vec2 vUv; void main() { vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec2 uRes;
#define PI 3.14159265359
float hash(vec2 p){ uvec2 q=uvec2(ivec2(floor(p))+ivec2(4096))*uvec2(1597334673u,3812015801u); uint n=(q.x^q.y)*1597334673u; n^=n>>16; n*=2246822519u; n^=n>>13; return float(n)*(1./4294967295.); }
`;
const FS_BG = HEAD + `
uniform float uTime; uniform int uMode; uniform vec3 uTint; uniform float uAmp;
uniform int uKA; uniform int uKB; uniform float uKMix; uniform float uKZoom; uniform float uKRot;
uniform float uP; uniform float uQ; uniform vec2 uA; uniform float uHRot; uniform float uHRad; uniform float uHue;
uniform sampler2D uTex; uniform float uReveal;
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
vec3 hsv(float h,float s,float v){ vec3 k=clamp(abs(mod(h*6.+vec3(0,4,2),6.)-3.)-1.,0.,1.); return v*mix(vec3(1),k,s); }
vec3 nebula(vec2 uv){
  float t=uTime*.02; vec2 p=uv*1.25;
  vec2 q=vec2(fbm(p+t), fbm(p+vec2(5.2,1.3)-t));
  float n=fbm(p+2.2*q+vec2(t*2.,0.));
  vec3 c=vec3(.008,.01,.025);
  c+=uTint*smoothstep(.35,1.05,n)*1.3;
  c+=uTint.zxy*.45*pow(clamp(q.y-.2,0.,1.),3.);

  c+=vec3(.9,.95,1.)*step(.9975,h)*(.55+.45*sin(uTime*2.+h*500.));
  return c;
}
// ---- Islamic star patterns: Hankin rays from the edge midpoint of a square or hexagonal cell, folded by p4m / p6m
vec2 kfold(vec2 p, int m){
  vec2 g; float n;
  if(m%2==0){ g=fract(p)-.5; n=4.; }
  else { vec2 s=vec2(1.,1.7320508); vec2 a=mod(p,s)-s*.5; vec2 b=mod(p-s*.5,s)-s*.5; g=dot(a,a)<dot(b,b)?a:b; n=6.; }

  ang=mod(ang,sec); if(ang>sec*.5) ang=sec-ang;
  return r*vec2(cos(ang),sin(ang));
}
float lineSD(vec2 q, vec2 m, float th){ return dot(q-m, vec2(-cos(th),-sin(th))); }
vec3 pal(float i){
  i=mod(i,6.);
  return i<1.?vec3(.05,.12,.30):i<2.?vec3(.04,.24,.27):i<3.?vec3(.40,.24,.09):i<4.?vec3(.30,.26,.20):i<5.?vec3(.34,.09,.08):vec3(.05,.05,.08);
}
vec3 girih(vec2 q, int m, float t){
  float th1, th2, rr;
  if(m==0){ th1=radians(67.5+5.*sin(t*.35)); th2=radians(112.5); rr=.17; }
  else if(m==1){ th1=radians(70.+6.*sin(t*.3)); th2=radians(125.); rr=.2; }
  else if(m==2){ th1=radians(52.+7.*sin(t*.4)); th2=radians(97.5); rr=.13; }
  else { th1=radians(80.+5.*sin(t*.33)); th2=radians(140.); rr=.25; }
  vec2 M=vec2(.5,0.);
  float s1=lineSD(q,M,th1), s2=lineSD(q,vec2(0.),th2), s3=length(q)-rr;
  float band=min(min(abs(s1),abs(s2)),abs(s3));
  float id=step(0.,s1)+2.*step(0.,s2)+3.*step(0.,s3);
  vec3 tile=pal(id+float(m))*(.72+.28*smoothstep(0.,.22,band));
  float w=.03, aa=.0045;
  float inB=smoothstep(w,w-aa,band);
  float outl=smoothstep(w+.013,w+.013-aa,band)-inB;
  vec3 gold=vec3(.96,.76,.38)*(.82+.3*sin(t*1.4+(q.x-q.y)*9.));
  vec3 col=mix(tile,vec3(.025,.02,.015),clamp(outl,0.,1.));
  return mix(col,gold,inB);
}
vec3 kaleido(vec2 uv){
  vec2 p=uv*uKZoom; float c=cos(uKRot), s=sin(uKRot); p=mat2(c,-s,s,c)*p;
  vec3 col=mix(girih(kfold(p,uKA),uKA,uTime), girih(kfold(p,uKB),uKB,uTime), uKMix);
  return col*(.92+.12*sin(length(uv)*2.5-uTime*.8));
}
// ---- hyperbolic {p,q} tilings in the Poincare disk
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x-a.y*b.y, a.x*b.y+a.y*b.x); }
vec2 cdiv(vec2 a, vec2 b){ return vec2(a.x*b.x+a.y*b.y, a.y*b.x-a.x*b.y)/dot(b,b); }
vec3 hyper(vec2 uv){
  vec2 z=uv/uHRad; float r2=dot(z,z);
  if(r2>=1.){ float rim=exp(-(sqrt(r2)-1.)*30.); return vec3(.45,.6,1.)*rim*.7+nebula(uv)*.5; }
  z=cdiv(z+uA, vec2(1.,0.)+cmul(vec2(uA.x,-uA.y),z));
  float c0=cos(uHRot), s0=sin(uHRot); z=mat2(c0,-s0,s0,c0)*z;
  float sp=sin(PI/uP), cp=cos(PI/uP), cq=cos(PI/uQ);
  float rr=sp/sqrt(cq*cq-sp*sp), cc=sqrt(1.+rr*rr);
  vec2 n=vec2(-sp,cp);
  float flips=0., inv=0.;
  for(int i=0;i<90;i++){
    bool ch=false;
    if(z.y<0.){ z.y=-z.y; flips+=1.; ch=true; }
    float d=dot(z,n); if(d>0.){ z-=2.*d*n; flips+=1.; ch=true; }
    vec2 w=z-vec2(cc,0.); float l2=dot(w,w);
    if(l2<rr*rr){ z=vec2(cc,0.)+w*(rr*rr/l2); flips+=1.; inv+=1.; ch=true; }
    if(!ch) break;
  }
  float px=(2./uRes.y/uHRad)*(1.-dot(z,z))/max(1.-r2,1e-5);
  float dE=abs(length(z-vec2(cc,0.))-rr);
  float dM=min(z.y, abs(dot(z,n)));
  float lineE=1.-smoothstep(.006, .006+px*1.5, dE);
  float lineM=1.-smoothstep(.0015, .0015+px*1.5, dM);
  float par=mod(flips,2.);
  vec3 base=hsv(uHue+inv*.045, .7, .42+.22*par);
  float shade=1.-.65*smoothstep(0.,1.,length(z)/(cc-rr));
  vec3 col=base*(.35+.65*shade);
  col=mix(col, vec3(1.,.9,.65), lineE*.95);
  col+=vec3(.55,.75,1.)*lineM*.22;
  col=mix(col, vec3(.35,.45,.8), smoothstep(.93,1.,sqrt(r2))*.7);
  return col;
}
// ---- carved stone: the text mask in uTex is cut into a bump-mapped rock surface up to uReveal
float sH(vec2 p){ return fbm(p*2.2)*.6+fbm(p*7.+4.)*.22-pow(1.-abs(noise(p*5.3)*2.-1.),28.)*.05; }
float mk(vec2 uv){ return texture(uTex,uv).r*smoothstep(uReveal+.003,uReveal-.003,uv.x); }
vec3 stone(vec2 uv, vec2 p){
  float px=2./uRes.y;
  float h=sH(p)-.34*mk(uv);
  float hx=sH(p+vec2(px*1.5,0.))-.34*mk(uv+vec2(1.5/uRes.x,0.));
  float hy=sH(p+vec2(0.,px*1.5))-.34*mk(uv+vec2(0.,1.5/uRes.y));
  vec3 n=normalize(vec3((h-hx)*42.,(h-hy)*42.,1.));
  vec3 L=normalize(vec3(-.55,.62,.56));
  float dif=max(dot(n,L),0.);
  float spec=pow(max(dot(reflect(-L,n),vec3(0.,0.,1.)),0.),26.)*.22;
  float m=mk(uv);
  vec3 alb=mix(vec3(.34,.33,.315),vec3(.50,.485,.45),fbm(p*5.+9.));
  alb*=1.-.42*m;
  vec3 col=alb*(.2+1.05*dif)*vec3(1.05,1.,.93)+spec;
  col+=vec3(1.,.55,.2)*exp(-abs(uv.x-uReveal)*140.)*m*.8;
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/(.5*uRes.y);
  vec3 c = uMode==0 ? nebula(uv) : uMode==1 ? kaleido(uv) : uMode==2 ? hyper(uv) : stone(gl_FragCoord.xy/uRes, uv);
  o=vec4(c*uAmp,1.);
}`;
const FS_ACC = HEAD + `uniform sampler2D uT; uniform float uW; void main(){ o = vec4(texture(uT, vUv).rgb * uW, 1.); }`;
const FS_DOWN = HEAD + `uniform sampler2D uT; uniform vec2 uTexel; uniform float uThresh;
vec3 pre(vec3 c){ if(uThresh<=0.) return c; float l=max(c.r,max(c.g,c.b)); float k=clamp(l-uThresh+.12,0.,.24); k=k*k/.48; return c*max(k,l-uThresh)/max(l,1e-4); }
void main(){ vec2 h=uTexel*.5;
  vec3 s=pre(texture(uT,vUv).rgb)*4.+pre(texture(uT,vUv-h).rgb)+pre(texture(uT,vUv+h).rgb)+pre(texture(uT,vUv+vec2(h.x,-h.y)).rgb)+pre(texture(uT,vUv-vec2(h.x,-h.y)).rgb);
  o=vec4(s/8.,1.); }`;
const FS_UP = HEAD + `uniform sampler2D uT; uniform vec2 uTexel;
void main(){ vec2 h=uTexel*.5; vec3 s=vec3(0.);
  s+=texture(uT,vUv+vec2(-h.x*2.,0.)).rgb; s+=texture(uT,vUv+vec2(-h.x,h.y)).rgb*2.; s+=texture(uT,vUv+vec2(0.,h.y*2.)).rgb; s+=texture(uT,vUv+vec2(h.x,h.y)).rgb*2.;
  s+=texture(uT,vUv+vec2(h.x*2.,0.)).rgb; s+=texture(uT,vUv+vec2(h.x,-h.y)).rgb*2.; s+=texture(uT,vUv+vec2(0.,-h.y*2.)).rgb; s+=texture(uT,vUv+vec2(-h.x,-h.y)).rgb*2.;
  o=vec4(s/12.,1.); }`;
const FS_FINAL = HEAD + `uniform sampler2D uScene; uniform sampler2D uBloom; uniform float uBloomAmt; uniform float uCA; uniform float uVig; uniform float uGrain;
uniform float uSeed; uniform float uSat; uniform float uSplit; uniform vec3 uTintS; uniform vec3 uTintH;
void main(){
  vec2 d=vUv-.5;
  vec3 c=vec3(texture(uScene,vUv-d*uCA).r, texture(uScene,vUv).g, texture(uScene,vUv+d*uCA).b);
  c+=texture(uBloom,vUv).rgb*uBloomAmt;
  vec3 k=max(c-.8,0.); c=min(c,.8)+k/(1.+k*5.);
  float l=dot(c,vec3(.2126,.7152,.0722));
  c=mix(c, c*mix(uTintS,uTintH,smoothstep(.04,.62,l)), uSplit);
  c=mix(vec3(l),c,uSat);
  c*=1.-uVig*smoothstep(.3,1.05,length(d*vec2(1.,.62))*1.5);
  c+=(hash(gl_FragCoord.xy+vec2(uSeed*37.,uSeed*17.))-.5)*uGrain*(.55+.45*(1.-l));
  o=vec4(c,1.);

function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }

  const pr = gl.createProgram(); gl.attachShader(pr, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(pr, 0, 'p'); gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(pr));
  const u = {}; for (const n of ['uRes', ...names]) u[n] = gl.getUniformLocation(pr, n); return { pr, u };

const P_BG = program(FS_BG, ['uTime', 'uMode', 'uTint', 'uAmp', 'uKA', 'uKB', 'uKMix', 'uKZoom', 'uKRot', 'uP', 'uQ', 'uA', 'uHRot', 'uHRad', 'uHue', 'uTex', 'uReveal']);
const P_ACC = program(FS_ACC, ['uT', 'uW']);
const P_DOWN = program(FS_DOWN, ['uT', 'uTexel', 'uThresh']);
const P_UP = program(FS_UP, ['uT', 'uTexel']);
const P_FIN = program(FS_FINAL, ['uScene', 'uBloom', 'uBloomAmt', 'uCA', 'uVig', 'uGrain', 'uSeed', 'uSat', 'uSplit', 'uTintS', 'uTintH']);
const VAO = gl.createVertexArray(); gl.bindVertexArray(VAO);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  gl.texImage2D(gl.TEXTURE_2D, 0, float ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, float ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);

  const sc = sceneAt(T); chapter(sc, T - sc.t0);
  subtitles(T);
  let flash = 0; for (const [th, k] of HITS) if (T >= th && T < th + 1.5) flash += .75 * k * Math.exp(-(T - th) * 5);

const SHUTTER = .5, JIT = [[.5, .5], [.25, .75], [.75, .25], [.125, .625], [.625, .125], [.375, .375], [.875, .875], [.0625, .5625]];
function frame(T, fps = 30, samples = 1) {

  T = clamp(T, 0, TOTAL - 1e-3);
  const sc = sceneAt(T), K = samples > 1 ? Math.max(1, sc.mb ?? 3) : 1;
  for (let k = 0; k < K; k++) {
    let tk = K > 1 ? Math.max(0, T + ((k + .5) / K - .5) * SHUTTER / fps) : T;
    if (sceneAt(tk) !== sc || (sc.shot && sc.shot(tk - sc.t0) !== sc.shot(T - sc.t0))) tk = T;
    drawLayer(tk, K > 1 ? JIT[k][0] - .5 : 0, K > 1 ? JIT[k][1] - .5 : 0);

}

// ======================================================================== fonts, playback, export hooks
let fontsReady = false;
const SRC = document.scripts[document.scripts.length - 1].textContent;
const CHARS = [...new Set(SRC.replace(/[\x00-\x7f]/g, ''))].join('') + 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
Promise.all([
  ...['400', '700', '900'].map(w => document.fonts.load(`${w} 40px "Noto Serif SC"`, CHARS)),
  document.fonts.load('400 40px "Cinzel"'), document.fonts.load('700 40px "Cinzel"'), document.fonts.load('italic 500 40px "Cormorant Garamond"'), document.fonts.load('500 40px "Cormorant Garamond"'),
  document.fonts.load('40px "Great Vibes"', "Il y a quelque chose à compléter Je n'ai pas le temps"), document.fonts.load('400 40px "STIX Two Text"', CHARS), document.fonts.load('italic 400 40px "STIX Two Text"', CHARS),
]).catch(() => {}).then(() => document.fonts.ready).then(() => { fontsReady = true; const l = document.getElementById('load'); if (l) l.textContent = '字体已就绪 · 建议全屏观看（F）'; frame(0); });
setTimeout(() => { fontsReady = true; }, 15000);

window.__ready = () => fontsReady;
window.__frame = (t, fps = 30) => { frame(t, fps, 3); return cv.toDataURL('image/jpeg', .93); };
window.__duration = TOTAL;
window.__cues = () => SC.flatMap(s => (s.sfx || []).map(([t, name, o]) => ({ t: +(s.t0 + t).toFixed(4), name, ...(o || {}) }))).sort((a, b) => a.t - b.t);

const au = document.getElementById('au');
au.src = (window.EMBED && window.EMBED.audio) ? 'data:audio/mpeg;base64,' + window.EMBED.audio : 'music.mp3';
if (EXPORT) { document.getElementById('start').remove(); document.getElementById('ui').remove(); }
else {
  let playing = false, clock0 = 0, useAudio = true, hideT = 0;
  const ui = document.getElementById('ui'), pp = document.getElementById('pp'), fill = document.getElementById('fill'), tm = document.getElementById('tm');
  document.getElementById('dur').textContent = `${Math.floor(TOTAL / 60)}:${String(Math.round(TOTAL % 60)).padStart(2, '0')}`;
  const now = () => useAudio ? au.currentTime : (performance.now() - clock0) / 1000;
  let loopId = 0, lastPaint = -Infinity;
  function loop(stamp) {
    loopId = 0;
    if (!playing) return;
    if (stamp - lastPaint < 1000 / 30 - 1) { loopId = requestAnimationFrame(loop); return; }
    lastPaint = stamp;
    const T = now(); frame(T);
    fill.style.width = (T / TOTAL * 100) + '%'; bar.setAttribute('aria-valuenow', String(T)); tm.textContent = `${Math.floor(T / 60)}:${String(Math.floor(T % 60)).padStart(2, '0')}`;
    if (T >= TOTAL - .05) { playing = false; pp.textContent = '▶'; }
    if (playing) loopId = requestAnimationFrame(loop);
  }
  function play() { if (playing) return; playing = true; lastPaint = -Infinity; pp.textContent = '❚❚'; au.play().catch(() => { useAudio = false; clock0 = performance.now() - au.currentTime * 1000; }); loopId = requestAnimationFrame(loop); }
  function pause() { playing = false; cancelAnimationFrame(loopId); loopId = 0; pp.textContent = '▶'; au.pause(); }
  document.getElementById('go').onclick = () => { document.getElementById('start').remove(); if (au.currentTime >= TOTAL - .1) au.currentTime = 0; play(); poke(); };
  pp.onclick = () => playing ? pause() : play();
  const bar = document.getElementById('bar');
  let dragging = false, resumeAfterDrag = false, scrubRender = 0, scrubTime = 0;
  bar.setAttribute('role', 'slider');
  bar.setAttribute('aria-label', '播放进度');
  bar.setAttribute('aria-valuemin', '0');
  bar.setAttribute('aria-valuemax', String(TOTAL));
  bar.setAttribute('aria-valuenow', '0');
  bar.tabIndex = 0;
  function seekTo(t) {
    scrubTime = clamp(t, 0, TOTAL);
    au.currentTime = scrubTime;
    if (!useAudio) clock0 = performance.now() - scrubTime * 1000;
    fill.style.width = (scrubTime / TOTAL * 100) + '%';
    tm.textContent = `${Math.floor(scrubTime / 60)}:${String(Math.floor(scrubTime % 60)).padStart(2, '0')}`;
    bar.setAttribute('aria-valuenow', String(scrubTime));
    if (!playing && !scrubRender) scrubRender = requestAnimationFrame(() => {
      scrubRender = 0;
      frame(scrubTime);
    });
  }
  function seekPointer(e) {
    const r = bar.getBoundingClientRect();
    seekTo(clamp((e.clientX - r.left) / r.width) * TOTAL);
  }
  bar.addEventListener('pointerdown', e => {
    if (!e.isPrimary || e.button !== 0 || dragging) return;
    e.preventDefault();
    dragging = true;
    resumeAfterDrag = playing;
    if (playing) pause();
    bar.setPointerCapture(e.pointerId);
    poke();
    clearTimeout(hideT);
    seekPointer(e);
  });
  bar.addEventListener('pointermove', e => {
    if (dragging && bar.hasPointerCapture(e.pointerId)) seekPointer(e);
  });
  function finishDrag(e, seekFinal) {
    if (!dragging) return;
    if (seekFinal) seekPointer(e);
    dragging = false;
    if (bar.hasPointerCapture(e.pointerId)) bar.releasePointerCapture(e.pointerId);
    if (resumeAfterDrag && scrubTime < TOTAL - .05) play();
    resumeAfterDrag = false;
    poke();
  }
  bar.addEventListener('pointerup', e => finishDrag(e, true));
  bar.addEventListener('pointercancel', e => finishDrag(e, false));
  bar.addEventListener('lostpointercapture', e => finishDrag(e, false));
  bar.addEventListener('keydown', e => {
    if (e.code === 'Home' || e.code === 'End') {
      e.preventDefault();
      seekTo(e.code === 'Home' ? 0 : TOTAL);
      poke();
    }
  });
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  function poke() { ui.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => { if (!dragging) ui.classList.add('hide'); }, 2200); }
  addEventListener('mousemove', poke);
  addEventListener('keydown', e => {
    if (document.getElementById('start')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'KeyF') document.getElementById('fs').click();
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); seekTo(now() + (e.code === 'ArrowRight' ? 5 : -5)); }
    poke();
  });
}
