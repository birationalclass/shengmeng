<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171610"><title>生成元 · 代数学</title><link rel="stylesheet" href="style.css?v=motion-6"></head><body>
<header><a class="icon home" href="../" aria-label="返回代数学">⌂</a><h1 data-zh="生成元" data-en="Generators"></h1><div class="groups" aria-label="Group"><button data-group="C6">C₆</button><button data-group="S3">S₃</button><button data-group="D4">D₄</button><button data-group="Q8">Q₈</button><button id="customOpen" class="icon" aria-label="自定义群"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 4V3a3 3 0 0 1 6 0v1h5v5h1a3 3 0 0 1 0 6h-1v5h-5v-1a3 3 0 0 0-6 0v1H4v-5H3a3 3 0 0 1 0-6h1V4z"/></svg></button></div><nav><button id="recordOpen" class="icon">☷</button><button id="help" class="icon">?</button><button id="lang">EN</button><button id="fullscreen" class="icon">□</button></nav></header>
<main><div class="arena"><canvas id="canvas"></canvas><div class="arena-hint" id="hint"></div><div id="equation" aria-live="polite"></div><div class="stage-label" id="stage"></div></div><aside class="hud"><div class="round-meter"><span class="pips">• ○ ○</span><b id="round">00</b></div><div class="size-ring"><span id="size">2 / 6</span></div><span id="roundLabel" class="sr-only"></span></aside>
<footer class="command"><div class="seed-tray"><span data-zh="起点" data-en="Seeds"></span><div id="seedTokens"></div><button id="seedOpen" class="icon">＋</button></div><div class="controls"><button id="reset" class="icon">↺</button><button id="step" class="icon">▸Ⅰ</button><button id="play" class="play">▶</button><button id="oneRound" class="icon">✦</button><div class="speed"><button data-speed="0.5">½×</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div></div><div class="progress"><i id="progress"></i></div><div class="outcome" id="outcome" aria-live="polite"></div></footer></main>
<dialog id="seeds"><button class="close" aria-label="Close">×</button><h2 data-zh="选择起点" data-en="Choose seeds"></h2><div id="palette"></div><p class="tiny" data-zh="数字是群元素编号，不是整数乘法。" data-en="Numbers identify group elements, not integer multiplication."></p><button class="close primary" data-zh="完成" data-en="Done"></button></dialog>
<dialog id="records"><button class="close" aria-label="Close">×</button><h2 data-zh="生成轨迹" data-en="Discovery trail"></h2><h3 id="setLabel"></h3><p id="summary"></p><div id="history"></div><p id="opCount"></p><p id="convention"></p><div id="identity"></div></dialog>
<dialog id="scores"><button class="close" aria-label="Close">×</button><h2 data-zh="生成值" data-en="Generation values"></h2><div id="scoreList"></div></dialog><dialog id="rules"><button class="close" aria-label="Close">×</button><h2 data-zh="让乘法变得可见" data-en="Make multiplication visible"></h2><ol><li data-zh="所有泡泡持续游动。✦ 数字是生成值：与当前泡泡左乘、右乘（含平方）能得到的不同新元素数，重复结果只计一次。" data-en="Bubbles keep moving. ✦ is the generation value: distinct unseen products with current bubbles, in either order, including the square. Duplicate results count once."></li><li data-zh="生成值越高，目标轨道越靠内。每次新元素出现即重算，泡泡平滑迁移；游动中，尚未出现的平方会分裂生成。" data-en="Higher values target inner orbits. Every discovery recalculates values and bubbles migrate smoothly. Unseen squares split off while drifting."></li><li data-zh="优先选取生成值最高的两个泡泡，边界同值随机选择。双方互相靠近并弹开。A、B 标记乘法顺序；优先选择能产生新元素的方向。" data-en="Select the two highest-valued bubbles, breaking ties randomly. Both approach and rebound. A and B mark multiplication order; a productive order is preferred."></li><li data-zh="若最高分的一对在两个方向都无新增，本次仍碰撞，暂时跳过这一对直到下次生成；避免反复碰撞而卡住。所有生成值为 0 时闭合，泡泡继续游动。" data-en="If neither order yields anything new, the pair still collides, then is skipped until the next discovery to avoid a deadlock. All-zero values mean closure; bubbles keep drifting."></li><li data-zh="轨道和相互吸引是引导力。接触瞬间使用等质量弹性碰撞，保留切向速度；分裂是群运算示意，并非质量复制的物理模型。" data-en="Orbits and mutual attraction are guiding forces. Contact uses equal-mass elastic collision, preserving tangential velocity. Splitting illustrates a group operation, not physical mass duplication."></li></ol><p data-zh="为什么最后是子群？有限群中，元素的正整数幂会包含单位元和逆元。因此非空集合在乘法下闭合后，恰好得到生成子群 ⟨S⟩。" data-en="Why a subgroup? In a finite group, positive powers include the identity and inverses. Closing a nonempty set under multiplication therefore gives exactly the generated subgroup ⟨S⟩."></p></dialog>
<dialog id="custom"><button class="close" aria-label="Close">×</button><h2 data-zh="输入有限群" data-en="Enter a finite group"></h2><p data-zh="1–16 个元素，用 1 到 n 编号。第 i 行第 j 列是 i·j；空格分列，换行分行。" data-en="1–16 elements numbered 1 to n. Row i, column j is i·j. Separate entries with spaces and rows with newlines."></p><textarea id="tableInput" rows="7" aria-label="Cayley table">1 2 3
2 3 1
3 1 2</textarea><p id="error" role="alert"></p><button id="import" class="primary" data-zh="验证并载入" data-en="Validate and load"></button></dialog><script type="module" src="app.mjs?v=motion-6"></script></body></html>
