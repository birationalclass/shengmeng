<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171610"><title>生成元实验室 · 代数学</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="icon" href="../" aria-label="返回代数学">⌂</a><span data-zh="生成元实验室" data-en="Generator laboratory"></span><nav><button id="help" data-zh="实验规则" data-en="How it works"></button><button id="lang">EN</button><button id="fullscreen" class="icon" aria-label="全屏">□</button></nav></header>
<main><aside class="setup"><div class="eyebrow" data-zh="有限群 · 二维实验" data-en="FINITE GROUPS · 2D LAB"></div><h1 data-zh="从几个元素，<br>生长出一个群。" data-en="A few elements.<br>A whole group."></h1><p class="muted" data-zh="选中泡泡，观察乘法如何让集合逐轮闭合。" data-en="Choose bubbles. Watch multiplication close the set, one round at a time."></p>
<label class="field"><span data-zh="实验中的群" data-en="Choose a group"></span><select id="group"><option value="S3">S₃ · 6</option><option value="C6">C₆ · 6</option><option value="D4">D₄ · 8</option><option value="Q8">Q₈ · 8</option><option value="custom" data-zh="自定义乘法表…" data-en="Custom Cayley table…"></option></select></label>
<div class="section-label"><span data-zh="选取初始元素" data-en="Choose initial elements"></span><span id="seedCount"></span></div><div id="palette"></div><p class="tiny" id="convention"></p><button id="reset" class="wide" data-zh="↺ 重新选取" data-en="↺ Choose again"></button>
<div class="legend"><span><i class="gold"></i><span data-zh="初始元素" data-en="Initial"></span></span><span><i class="mint"></i><span data-zh="新生成" data-en="Generated"></span></span></div><div class="note" data-zh="泡泡上的数字是元素编号。<br>不是整数乘法。" data-en="Numbers identify group elements.<br>They are not integer multiplication."></div></aside>
<section class="experiment"><div class="arena-head"><div><span class="eyebrow" data-zh="生成空间" data-en="GENERATION SPACE"></span><h2 id="setLabel">⟨S⟩</h2></div><div class="metrics"><b id="round">00</b><span id="roundLabel"></span><b id="size">2 / 6</b><span data-zh="已出现 / 群阶" data-en="Present / order"></span></div></div>
<div class="arena"><canvas id="canvas" aria-label="群元素泡泡动画；使用左侧按钮选择元素"></canvas><div class="arena-hint" id="hint"></div><div id="equation" aria-live="polite"></div><div class="stage-label" id="stage"></div></div>
<div class="controls"><button id="play" class="primary"></button><button id="step" data-zh="单次交互" data-en="One interaction"></button><button id="oneRound" data-zh="一轮" data-en="One round"></button><label class="speed"><span data-zh="速度" data-en="Speed"></span><select id="speed"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div><div class="progress"><i id="progress"></i></div><div class="summary" id="summary" aria-live="polite"></div></section>
<aside class="record"><div class="section-label"><span data-zh="生成轨迹" data-en="Discovery trail"></span><span id="opCount">0</span></div><p class="tiny" data-zh="只记录首次出现；重复乘积仍会完成碰撞。" data-en="First discoveries only. Repeated products still collide."></p><div id="history"></div><div class="identity" id="identity"></div></aside></main>
<dialog id="rules"><button class="close" aria-label="Close">×</button><h2 data-zh="让乘法变得可见" data-en="Make multiplication visible"></h2><ol><li data-zh="选择非空的初始集合 S。每个泡泡始终代表同一个群元素。" data-en="Choose a nonempty set S. Each bubble always represents one group element."></li><li data-zh="每轮冻结轮初集合，检查所有有序对：x·x 演示为分裂；A·B 演示为 A 撞向 B。A·B 与 B·A 分别检查。" data-en="Freeze the starting set each round and check every ordered pair: x·x splits; A·B sends A into B. A·B and B·A are checked separately."></li><li data-zh="乘积尚未出现才新增泡泡。已有结果只亮起，不复制；新泡泡下一轮才参与。完整一轮无新增时结束。" data-en="Create a bubble only for a new product; otherwise highlight the existing result. New bubbles join the next round. Stop after a complete round with no discoveries."></li><li data-zh="碰撞瞬间采用等质量弹性碰撞：A 的法向速度传给 B。新元素以零初速度出现。引导、游动与回位属于外力控制，整个场景并非封闭物理系统。分裂是乘法示意，不表示物质复制。" data-en="At impact, equal-mass elastic collision transfers A’s normal velocity to B. New elements appear at rest. Guiding, drift and repositioning use external forces; the whole scene is not a closed physical system. Splitting illustrates multiplication, not matter duplication."></li></ol><p data-zh="为什么最后是子群？有限群中，元素的正整数幂会包含单位元和逆元。因此非空集合在乘法下闭合后，恰好得到生成子群 ⟨S⟩。" data-en="Why a subgroup? In a finite group, positive powers include the identity and inverses. Closing a nonempty set under multiplication therefore gives exactly the generated subgroup ⟨S⟩."></p></dialog>
<dialog id="custom"><button class="close" aria-label="Close">×</button><h2 data-zh="输入有限群" data-en="Enter a finite group"></h2><p data-zh="1–16 个元素，用 1 到 n 编号。第 i 行第 j 列是 i·j；空格分列，换行分行。" data-en="1–16 elements numbered 1 to n. Row i, column j is i·j. Separate entries with spaces and rows with newlines."></p><textarea id="tableInput" rows="7" aria-label="Cayley table">1 2 3
2 3 1
3 1 2</textarea><p id="error" role="alert"></p><button id="import" class="primary" data-zh="验证并载入" data-en="Validate and load"></button></dialog><script type="module" src="app.mjs"></script></body></html>
