<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星盘图谱 · 二十种星河</title><style>
*{box-sizing:border-box}body{margin:0;background:#050914;color:#d4e5f9;font-family:Georgia,'Songti SC',serif}header{padding:32px 5vw;display:flex;align-items:center;gap:30px}header h1{font-weight:400;font-size:25px}a{color:#9abedc}header a{margin-left:auto}p{font:12px/1.8 system-ui;color:#8ca5c2}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:0 5vw 40px}.card{color:inherit;text-align:left;border:1px solid #8db7eb26;background:linear-gradient(135deg,#101a2b,#070b15);padding:0;cursor:pointer;transition:border .3s,transform .3s}.card:hover{border-color:#b9d7ef;transform:translateY(-3px)}canvas{display:block;width:100%;aspect-ratio:1.35}.caption{padding:16px;border-top:1px solid #abc5ed15}.caption b{font:12px system-ui;color:#8aa8cc;margin-right:14px}.caption small{display:block;font:10px system-ui;color:#6c8daf;margin:8px 0 0 32px}dialog{background:#050a15;color:#dbeaff;border:1px solid #aacded55;max-width:90vw;width:960px;padding:18px}dialog::backdrop{background:#01040bd9}dialog canvas{max-height:65vh;aspect-ratio:1.5}dialog button{background:#14243a;color:#d7e7f8;border:1px solid #7e9fc366;padding:10px 18px;cursor:pointer}dialog h2{font-weight:400}footer{padding:0 5vw 40px}@media(max-width:850px){.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){header{display:block}.gallery{gap:10px}.caption{padding:12px;font-size:14px}}
</style><header><div><h1>星盘图谱 · 二十种星河</h1><p>点击放大 · 粒子严格共面 · 中心留空 · 12 种星系结构 + 8 种经典星座</p></div><a href="./?mute=1">返回星图 ↗</a></header><div class="gallery"></div><dialog><button id="close">关闭</button><h2></h2><canvas id="preview"></canvas><p>星座图案采用亮星节点与星尘连线；这是艺术化布局，不是真实天体的空间分布。星系图案展示旋转内流。</p></dialog><footer><p>结构参考：<a href="https://esahubble.org/images/archive/top100/" target="_blank">Hubble · M51 / NGC 1300 / NGC 2841</a> · <a href="https://esawebb.org/images/weic2211c/" target="_blank">Webb · 车轮星系</a> · <a href="https://esawebb.org/images/weic2420g/" target="_blank">Webb · Arp 142</a> · <a href="https://iauarchive.eso.org/public/themes/constellations/" target="_blank">IAU · 星座图谱</a></p></footer><script type="module">
import {DISK_STYLES,diskPoints,CONSTELLATIONS} from './disk-patterns.mjs?v=campaign-57';
const sets=DISK_STYLES.map((_,i)=>diskPoints(i,5200,i>=12?0:2.8,12)),dialog=document.querySelector('dialog'),preview=document.querySelector('#preview');let selected=0;
function draw(canvas,points,time=0,large=false,style=0){const dpr=Math.min(devicePixelRatio,1.5),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)){canvas.width=w*dpr;canvas.height=h*dpr;}const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);const scale=Math.min(w/27,h/19);c.fillStyle='#86bde0';for(let j=0;j<points.length;j+=3){const initial=Math.hypot(points[j],points[j+2]),phase=((initial-2.8)/9.2-time*.007)%1,u=(phase+1)%1,r=CONSTELLATIONS[style]?initial:2.8+u*9.2,a=Math.atan2(points[j+2],points[j])+time*.09-2*Math.log(r/initial),fade=Math.min(1,u/.08,(1-u)/.09);c.globalAlpha=fade*(.25+(j%17)/30);c.fillStyle=j%9===0?'#d8b7ef':j%7===0?'#efd5a2':'#86bde0';c.fillRect(w/2+Math.cos(a)*r*scale,h/2+Math.sin(a)*r*scale*.62,large?1.15:.8,large?1.15:.8);}c.globalAlpha=1;
 if(CONSTELLATIONS[style]){const {nodes,edges}=CONSTELLATIONS[style],unit=12/14;const pos=n=>[w/2+n[0]*unit*scale,h/2+(n[1]-1)*unit*scale*.62];c.strokeStyle='#9fcef255';c.lineWidth=.8;c.setLineDash([2,4]);for(const [a,b] of edges){c.beginPath();c.moveTo(...pos(nodes[a]));c.lineTo(...pos(nodes[b]));c.stroke();}c.setLineDash([]);for(const n of nodes){const [x,y]=pos(n);const glow=c.createRadialGradient(x,y,0,x,y,large?13:8);glow.addColorStop(0,'#fffceeff');glow.addColorStop(.18,'#d2eaffee');glow.addColorStop(1,'#80bfff00');c.fillStyle=glow;c.beginPath();c.arc(x,y,large?13:8,0,Math.PI*2);c.fill();} }
 if(CONSTELLATIONS[style])return;c.strokeStyle='#bda36b40';c.beginPath();c.ellipse(w/2,h/2,2.6*scale,1.6*scale,0,0,Math.PI*2);c.stroke();}
const canvases=DISK_STYLES.map(([name,ref],i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<canvas></canvas><div class="caption"><b>${String(i+1).padStart(2,'0')}</b>${name}<small>${ref}</small></div>`;document.querySelector('.gallery').append(b);b.onclick=()=>{selected=i;dialog.querySelector('h2').textContent=`${String(i+1).padStart(2,'0')} · ${name}`;dialog.showModal();};return b.querySelector('canvas');});
document.querySelector('#close').onclick=()=>dialog.close();let last=0;function frame(now){requestAnimationFrame(frame);if(document.hidden)return;if(dialog.open)draw(preview,sets[selected],selected>=12?0:now*.001,true,selected);else if(now-last>120){canvases.forEach((c,i)=>draw(c,sets[i],0,false,i));last=now;}}requestAnimationFrame(frame);
</script></html>
